name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: site/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('site/pnpm-lock.yaml') }}-${{ hashFiles('site/app/**/*', 'site/components/**/*', 'site/lib/**/*', 'docs/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('site/pnpm-lock.yaml') }}-

      - name: Restore optimized images cache
        uses: actions/cache@v4
        with:
          path: site/public/images
          key: ${{ runner.os }}-images-${{ hashFiles('docs/**/images/*') }}
          restore-keys: |
            ${{ runner.os }}-images-

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ./site
        run: pnpm install --frozen-lockfile

      - name: Build static site
        working-directory: ./site
        run: pnpm build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
