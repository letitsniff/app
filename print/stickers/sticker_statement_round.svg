<svg viewBox="0 0 500 500" width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap');
      .title-top {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 26px;
        fill: #F0E8D5;
        letter-spacing: 4px;
      }
      .statement-main {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 42px;
        fill: #FDFAF5;
        letter-spacing: 1px;
        text-anchor: middle;
      }
      .statement-sub {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 17px;
        font-weight: 600;
        fill: #E8A84A;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }
      .statement-url {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #F0E8D5;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>

    <path id="statTopPath" d="M 60,250 A 190,190 0 0,1 440,250" fill="none" />
    <path id="statBottomPath" d="M 440,250 A 190,190 0 0,1 60,250" fill="none" />
  </defs>

  <!-- Deep Forest Green Background Badge -->
  <circle cx="250" cy="250" r="248" fill="#3D5C38" stroke="#2C1810" stroke-width="2" />

  <!-- Elegant Inner Border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#E8A84A" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6,4" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FDFAF5" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Top Curved Brand Name -->
  <text class="title-top">
    <textPath href="#statTopPath" startOffset="50%" text-anchor="middle">
      LET IT SNIFF
    </textPath>
  </text>

  <!-- Decorative Paw / Star Accents -->
  <!-- Left Paw -->
  <g transform="translate(68, 240) scale(0.6)" fill="#E8A84A">
    <ellipse cx="16" cy="22" rx="6.5" ry="5.5" />
    <circle cx="8" cy="12" r="3.5" />
    <circle cx="24" cy="12" r="3.5" />
    <circle cx="12" cy="7" r="2.8" />
    <circle cx="20" cy="7" r="2.8" />
  </g>
  <!-- Right Paw -->
  <g transform="translate(412, 240) scale(0.6)" fill="#E8A84A">
    <ellipse cx="16" cy="22" rx="6.5" ry="5.5" />
    <circle cx="8" cy="12" r="3.5" />
    <circle cx="24" cy="12" r="3.5" />
    <circle cx="12" cy="7" r="2.8" />
    <circle cx="20" cy="7" r="2.8" />
  </g>

  <!-- Center Artwork & Statement -->
  <!-- Center Stylized Paw / Nose -->
  <g transform="translate(230, 140) scale(1.3)" fill="#E8A84A">
    <ellipse cx="16" cy="22" rx="6.5" ry="5.5" />
    <circle cx="8" cy="12" r="3.5" />
    <circle cx="24" cy="12" r="3.5" />
    <circle cx="12" cy="7" r="2.8" />
    <circle cx="20" cy="7" r="2.8" />
  </g>

  <text x="250" y="240" class="statement-main">
    ΑΦΗΣΕ ΤΟΝ
  </text>
  <text x="250" y="286" class="statement-main">
    ΝΑ ΜΥΡΙΣΕΙ.
  </text>

  <text x="250" y="328" class="statement-sub">
    Η ΟΣΦΡΗΣΗ ΕΙΝΑΙ ΑΝΑΓΚΗ
  </text>

  <!-- Bottom Curved URL & Philosophy -->
  <text class="statement-url">
    <textPath href="#statBottomPath" startOffset="50%" text-anchor="middle">
      ΕΚΠΑΙΔΕΥΣΗ ΧΩΡΙΣ ΚΑΤΑΝΑΓΚΑΣΜΟ • LETITSNIFF.GR
    </textPath>
  </text>
</svg>
